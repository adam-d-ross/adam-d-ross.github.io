    "id": "34A",
    "official_code": "34A",
    "name": "Commercial Specialty Beer",
    "category_id": 34,

  },
  "34B": {

    "name": "Mixed-Style Beer",

  },
  "34C": {

    "ibu": [
      15.0,

    ],
    "srm": [
      3.0,
      5.0
    ],
    "abv": [
      5.0,
      6.5
    ]
  }
};
const c=document.getElementById('myCanvas'), ctx=c.getContext('2d');
const d=document.getElementById('titleCanvas'), dtx=d.getContext('2d');

const srmStops = [
[1,[248,246,187]],[2,[243,249,147]],[3,[246,245,19]],[4,[234,230,21]],[5,[224,208,27]],
[6,[213,188,38]],[7,[205,170,55]],[8,[193,150,60]],[9,[190,140,58]],[10,[190,130,58]],
[11,[193,122,55]],[12,[191,113,56]],[13,[188,103,51]],[14,[178,96,51]],[15,[168,88,57]],
[16,[152,83,54]],[17,[141,76,50]],[18,[124,69,45]],[19,[107,58,30]],[20,[93,52,26]],
[21,[78,42,12]],[22,[74,39,39]],[23,[54,31,27]],[24,[38,23,22]],[25,[35,23,22]],
[26,[25,16,15]],[27,[22,16,15]],[28,[18,13,12]],[29,[16,11,10]],[30,[5,11,10]],[40,[0,0,0]]
];
function srmColor(v) {
  v=Math.max(1,Math.min(40,v));
  let lo=srmStops[0], hi=srmStops[srmStops.length-1];
  for(let i=1;i<srmStops.length;i++) if(v<=srmStops[i][0]) { lo=srmStops[i-1]; hi=srmStops[i]; break; }
  const t=(v-lo[0])/(hi[0]-lo[0]||1), rgb=lo[1].map((x,i)=>Math.round(x+(hi[1][i]-x)*t));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}
function drawBase() {
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#ddd'; ctx.lineWidth=1; ctx.font='16px Arial'; ctx.fillStyle='#444';
  // Plot: ABV 0-14% on X, IBU 0-100 on Y. Matches original coordinate system.
  for(let abv=0;abv<=14;abv++) { const x=100+abv*100; ctx.beginPath(); ctx.moveTo(x,100);ctx.lineTo(x,1100);ctx.stroke(); ctx.fillText(abv+'%',x-10,1090); }
  for(let ibu=0;ibu<=100;ibu+=10) { const y=1100-ibu*10; ctx.beginPath();ctx.moveTo(100,y);ctx.lineTo(1500,y);ctx.stroke();ctx.fillText(String(ibu),55,y+5); }
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(100,100);ctx.lineTo(100,1100);ctx.lineTo(1500,1100);ctx.stroke();
  ctx.font='20px Arial';ctx.fillText('IBU',20,120);ctx.fillText('ABV',1450,1085);
}
const dashPatterns = [[], [12,6], [3,5], [12,5,3,5], [2,3], [18,5], [8,4,2,4]];

function drawBeer(s, index) {
  const [ibuL,ibuH]=s.ibu, [srmL,srmH]=s.srm, [abvL,abvH]=s.abv;
  const x=100+abvL*100, y=1100-ibuH*10, w=(abvH-abvL)*100, h=(ibuH-ibuL)*10;
  const grd=ctx.createLinearGradient(x,y,x+w,y); grd.addColorStop(0,srmColor(srmL)); grd.addColorStop(1,srmColor(srmH));
  ctx.fillStyle=grd; ctx.globalAlpha=.42; ctx.fillRect(x,y,w,h); ctx.globalAlpha=1;
  ctx.strokeStyle='#111'; ctx.lineWidth=3; ctx.setLineDash(dashPatterns[index % dashPatterns.length]); ctx.strokeRect(x,y,w,h); ctx.setLineDash([]);

  // Number badge makes overlapping ranges identifiable without replacing the SRM colors.
  const bx=Math.max(104, Math.min(1470, x+8)), by=Math.max(112, y+24);
  ctx.beginPath(); ctx.arc(bx,by,14,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fill();
  ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='#111'; ctx.font='bold 15px Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(index+1),bx,by); ctx.textAlign='start'; ctx.textBaseline='alphabetic';
}

function parseStyleIds() {
  const raw = new URLSearchParams(location.search).get('style');
  if (!raw) return [];
  // Supports encoded plus-separated comparisons and also comma/space separated links.
  return raw.split(/[+,\s]+/).map(x=>x.trim()).filter(Boolean);
}

function styleLabel(s) {
  return (s.official_code==='27' ? '27. ' : s.official_code+'. ')+s.name;
}

function rangeText(s) {
  if (!(s.ibu && s.srm && s.abv)) return 'No single fixed range (varies by base style / specialty ingredients)';
  return `IBU ${s.ibu[0]}–${s.ibu[1]}   SRM ${s.srm[0]}–${s.srm[1]}   ABV ${s.abv[0]}–${s.abv[1]}%`;
}

function render() {
  drawBase(); dtx.clearRect(0,0,d.width,d.height); dtx.fillStyle='#111';
  const ids=parseStyleIds();
  if(!ids.length) {
    dtx.font='38px Arial'; dtx.fillText('BJCP 2021 Beer Style Explorer',10,50);
    dtx.font='22px Arial'; dtx.fillText('Choose one or more styles from the menu.',10,90); return;
  }

  const chosen=ids.map(id=>styles[id]).filter(Boolean);
  const unknown=ids.filter(id=>!styles[id]);
  if(!chosen.length) { dtx.font='38px Arial'; dtx.fillText('Unknown style: '+ids.join(', '),10,50); return; }

  dtx.font='36px Arial'; dtx.fillText(chosen.length===1 ? styleLabel(chosen[0]) : `Comparing ${chosen.length} BJCP styles`,10,45);
  dtx.font='17px Arial';

  const colWidth=520, rowHeight=42, startY=76;
  chosen.forEach((s,i)=>{
    if(s.ibu && s.srm && s.abv) drawBeer(s,i);
    const col=Math.floor(i/3), row=i%3;
    const x=10+col*colWidth, y=startY+row*rowHeight;
    dtx.font='bold 16px Arial'; dtx.fillText(`${i+1}. ${styleLabel(s)}`,x,y);
    dtx.font='14px Arial'; dtx.fillText(rangeText(s),x,y+18);
  });

  if(unknown.length) {
    dtx.font='14px Arial'; dtx.fillText('Unknown style IDs: '+unknown.join(', '),10,192);
  }
}
render();
