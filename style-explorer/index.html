<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BJCP 2021 Style Explorer</title>
<style>
:root {
  --nav-width: 390px;
  --border: #d7d7d7;
  --panel: #fafafa;
  --category: #777;
  --category-active: #555;
  --selected: #dcecff;
  --selected-text: #003a75;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: #111;
  background: #fff;
}
button { font: inherit; }
.layout {
  display: grid;
  grid-template-columns: minmax(300px, var(--nav-width)) minmax(0, 1fr);
  min-height: 100vh;
}
.stylenav {
  height: 100vh;
  overflow-y: auto;
  padding: 12px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overscroll-behavior: contain;
}
.comparebar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255,255,255,.97);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.comparebar strong { display: block; margin-bottom: 4px; font-size: 17px; }
.comparebar .hint { font-size: 12px; color: #666; line-height: 1.4; }
.compare-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.action-button {
  padding: 7px 10px;
  border: 1px solid #aaa;
  border-radius: 5px;
  background: #f7f7f7;
  cursor: pointer;
}
.action-button:disabled { opacity: .5; cursor: default; }

.collapsible {
  background: var(--category);
  color: #fff;
  cursor: pointer;
  padding: 14px 16px;
  width: 100%;
  border: 0;
  text-align: left;
  font-size: 15px;
  margin-top: 2px;
  min-height: 46px;
}
.collapsible:hover, .collapsible.active { background: var(--category-active); }
.collapsible::after { content: '+'; float: right; font-weight: bold; }
.collapsible.active::after { content: '−'; }
.content {
  display: none;
  padding: 7px 8px 9px;
  background: #f1f1f1;
}
.content.open { display: block; }
.style-link {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
  color: #0645ad;
  text-align: left;
  cursor: pointer;
  padding: 7px 8px;
  border-radius: 5px;
  line-height: 1.25;
}
.style-link:hover { background: #e8eef7; }
.style-link.selected {
  background: var(--selected);
  color: var(--selected-text);
  font-weight: bold;
}

.viewer {
  min-width: 0;
  padding: 20px clamp(12px, 2.5vw, 36px) 40px;
  overflow-x: hidden;
}
.graph-card {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
}
.graph-scroll {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
#myCanvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 11;
  background: #fff;
}
#styleDetails {
  width: 100%;
  margin: 18px 0 0;
  padding: 0 4px 28px;
}
#styleDetails h1 {
  font-size: clamp(26px, 3.2vw, 42px);
  font-weight: normal;
  margin: 0 0 18px;
  line-height: 1.08;
}
.style-detail {
  margin: 0 0 15px;
  line-height: 1.35;
}
.style-detail-name { font-size: 18px; font-weight: bold; }
.style-detail-range { margin-top: 3px; font-size: 16px; }
.style-detail-note { margin-top: 3px; font-size: 14px; color: #555; }
.empty-message { font-size: 20px; }
.mobile-jump {
  display: none;
}

@media (max-width: 800px) {
  .layout { display: block; }
  .stylenav {
    height: auto;
    max-height: 48vh;
    border-right: 0;
    border-bottom: 1px solid var(--border);
    padding: 8px;
  }
  .comparebar {
    padding: 9px;
  }
  .comparebar .hint { font-size: 11px; }
  .collapsible {
    min-height: 48px;
    padding: 13px 14px;
    font-size: 16px;
  }
  .style-link {
    min-height: 44px;
    padding: 10px 8px;
    font-size: 16px;
  }
  .viewer {
    padding: 14px 8px 28px;
  }
  .graph-card {
    max-width: none;
  }
  #myCanvas {
    width: 100%;
    min-width: 0;
  }
  #styleDetails {
    padding: 0 8px 24px;
    margin-top: 14px;
  }
  #styleDetails h1 {
    font-size: 28px;
  }
  .style-detail-name { font-size: 17px; }
  .style-detail-range { font-size: 15px; }
  .mobile-jump {
    display: inline-block;
  }
}

@media (max-width: 480px) {
  .stylenav { max-height: 52vh; }
  .viewer { padding-left: 4px; padding-right: 4px; }
  #styleDetails h1 { font-size: 25px; }
}
</style>
</head>

},"30B":{"id":"30B","official_code":"30B","name":"Autumn Seasonal Beer","category_id":30,"category":"Spiced Beer","ibu":null,"srm":null,"abv":null},"30C":{"id":"30C","official_code":"30C","name":"Winter Seasonal Beer","category_id":30,"category":"Spiced Beer","ibu":null,"srm":null,"abv":null},"30D":{"id":"30D","official_code":"30D","name":"Specialty Spice Beer","category_id":30,"category":"Spiced Beer","ibu":null,"srm":null,"abv":null},"31A":{"id":"31A","official_code":"31A","name":"Alternative Grain Beer","category_id":31,"category":"Alternative Fermentables Beer","ibu":null,"srm":null,"abv":null},"31B":{"id":"31B","official_code":"31B","name":"Alternative Sugar Beer","category_id":31,"category":"Alternative Fermentables Beer","ibu":null,"srm":null,"abv":null},"32A":{"id":"32A","official_code":"32A","name":"Classic Style Smoked Beer","category_id":32,"category":"Smoked Beer","ibu":null,"srm":null,"abv":null},"32B":{"id":"32B","official_code":"32B","name":"Specialty Smoked Beer","category_id":32,"category":"Smoked Beer","ibu":null,"srm":null,"abv":null},"33A":{"id":"33A","official_code":"33A","name":"Wood-Aged Beer","category_id":33,"category":"Wood Beer","ibu":null,"srm":null,"abv":null},"33B":{"id":"33B","official_code":"33B","name":"Specialty Wood-Aged Beer","category_id":33,"category":"Wood Beer","ibu":null,"srm":null,"abv":null},"34A":{"id":"34A","official_code":"34A","name":"Commercial Specialty Beer","category_id":34,"category":"Specialty Beer","ibu":null,"srm":null,"abv":null},"34B":{"id":"34B","official_code":"34B","name":"Mixed-Style Beer","category_id":34,"category":"Specialty Beer","ibu":null,"srm":null,"abv":null},"34C":{"id":"34C","official_code":"34C","name":"Experimental Beer","category_id":34,"category":"Specialty Beer","ibu":[15.0,22.0],"srm":[3.0,5.0],"abv":[5.0,6.5]}};

const selectedStyles = new Set();
const canvas = document.getElementById('myCanvas');
const ctx = canvas.getContext('2d');
const details = document.getElementById('styleDetails');
const clearButton = document.getElementById('clearComparison');
const jumpButton = document.getElementById('jumpToGraph');
const viewer = document.getElementById('viewer');
const styleButtons = [...document.querySelectorAll('.style-link')];

const srmStops = [
[1,[248,246,187]],[2,[243,249,147]],[3,[246,245,19]],[4,[234,230,21]],[5,[224,208,27]],
[6,[213,188,38]],[7,[205,170,55]],[8,[193,150,60]],[9,[190,140,58]],[10,[190,130,58]],
[11,[193,122,55]],[12,[191,113,56]],[13,[188,103,51]],[14,[178,96,51]],[15,[168,88,57]],
[16,[152,83,54]],[17,[141,76,50]],[18,[124,69,45]],[19,[107,58,30]],[20,[93,52,26]],
[21,[78,42,12]],[22,[74,39,39]],[23,[54,31,27]],[24,[38,23,22]],[25,[35,23,22]],
[26,[25,16,15]],[27,[22,16,15]],[28,[18,13,12]],[29,[16,11,10]],[30,[5,11,10]],[40,[0,0,0]]
];

function srmColor(v) {
  v = Math.max(1, Math.min(40, v));
  let lo = srmStops[0], hi = srmStops[srmStops.length - 1];
  for (let i = 1; i < srmStops.length; i++) {
    if (v <= srmStops[i][0]) { lo = srmStops[i - 1]; hi = srmStops[i]; break; }
  }
  const t = (v - lo[0]) / (hi[0] - lo[0] || 1);
  const rgb = lo[1].map((x, i) => Math.round(x + (hi[1][i] - x) * t));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

function drawBase() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.font = '16px Arial';
  ctx.fillStyle = '#444';

  for (let abv = 0; abv <= 14; abv++) {
    const x = 100 + abv * 100;
    ctx.beginPath(); ctx.moveTo(x, 100); ctx.lineTo(x, 1100); ctx.stroke();
    ctx.fillText(abv + '%', x - 10, 1090);
  }
  for (let ibu = 0; ibu <= 100; ibu += 10) {
    const y = 1100 - ibu * 10;
    ctx.beginPath(); ctx.moveTo(100, y); ctx.lineTo(1500, y); ctx.stroke();
    ctx.fillText(String(ibu), 55, y + 5);
  }
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(100, 100); ctx.lineTo(100, 1100); ctx.lineTo(1500, 1100); ctx.stroke();
  ctx.font = '20px Arial';
  ctx.fillText('IBU', 20, 120);
  ctx.fillText('ABV', 1450, 1085);
}

const dashPatterns = [[], [12,6], [3,5], [12,5,3,5], [2,3], [18,5], [8,4,2,4]];

function drawBeer(s, index) {
  const [ibuL, ibuH] = s.ibu;
  const [srmL, srmH] = s.srm;
  const [abvL, abvH] = s.abv;
  const x = 100 + abvL * 100;
  const y = 1100 - ibuH * 10;
  const w = (abvH - abvL) * 100;
  const h = (ibuH - ibuL) * 10;

  const grd = ctx.createLinearGradient(x, y, x + w, y);
  grd.addColorStop(0, srmColor(srmL));
  grd.addColorStop(1, srmColor(srmH));
  ctx.fillStyle = grd;
  ctx.globalAlpha = .42;
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;

  ctx.strokeStyle = '#111';
  ctx.lineWidth = 3;
  ctx.setLineDash(dashPatterns[index % dashPatterns.length]);
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);

  const bx = Math.max(104, Math.min(1470, x + 8));
  const by = Math.max(112, y + 24);
  ctx.beginPath();
  ctx.arc(bx, by, 14, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.fill();
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#111';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(index + 1), bx, by);
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

function styleLabel(s) {
  return (s.official_code === '27' ? '27. ' : s.official_code + '. ') + s.name;
}

function rangeText(s) {
  if (!(s.ibu && s.srm && s.abv)) {
    return 'No single fixed range (varies by base style / specialty ingredients)';
  }
  return `IBU ${s.ibu[0]}–${s.ibu[1]}   SRM ${s.srm[0]}–${s.srm[1]}   ABV ${s.abv[0]}–${s.abv[1]}%`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function updateUrl() {
  const url = new URL(location.href);
  if (selectedStyles.size) {
    url.searchParams.set('style', [...selectedStyles].join('+'));
  } else {
    url.searchParams.delete('style');
  }
  history.replaceState(null, '', url.pathname + url.search + url.hash);
}

function render() {
  drawBase();

  styleButtons.forEach(btn => btn.classList.toggle('selected', selectedStyles.has(btn.dataset.style)));
  clearButton.disabled = selectedStyles.size === 0;

  const chosen = [...selectedStyles].map(id => styles[id]).filter(Boolean);
  chosen.forEach((s, i) => {
    if (s.ibu && s.srm && s.abv) drawBeer(s, i);
  });

  if (!chosen.length) {
    details.innerHTML = '<h1>BJCP 2021 Beer Style Explorer</h1><div class="empty-message">Choose one or more styles above.</div>';
    return;
  }

  const heading = chosen.length === 1 ? styleLabel(chosen[0]) : `Comparing ${chosen.length} BJCP styles`;
  const rows = chosen.map((s, i) => `
    <div class="style-detail">
      <div class="style-detail-name">${i + 1}. ${escapeHtml(styleLabel(s))}</div>
      <div class="style-detail-range">${escapeHtml(rangeText(s))}</div>
    </div>`).join('');

  details.innerHTML = `<h1>${escapeHtml(heading)}</h1>${rows}`;
}

function toggleStyle(id, scrollOnMobile = false) {
  if (selectedStyles.has(id)) selectedStyles.delete(id);
  else selectedStyles.add(id);
  updateUrl();
  render();

  if (scrollOnMobile && window.matchMedia('(max-width: 800px)').matches) {
    viewer.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

styleButtons.forEach(btn => btn.addEventListener('click', () => toggleStyle(btn.dataset.style, false)));

document.querySelectorAll('.collapsible').forEach(btn => {
  btn.addEventListener('click', () => {
    const isOpen = btn.classList.toggle('active');
    btn.setAttribute('aria-expanded', String(isOpen));
    btn.nextElementSibling.classList.toggle('open', isOpen);
  });
});

clearButton.addEventListener('click', () => {
  selectedStyles.clear();
  updateUrl();
  render();
});

jumpButton.addEventListener('click', () => {
  viewer.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function initializeFromUrl() {
  const raw = new URLSearchParams(location.search).get('style');
  if (!raw) return;
  raw.split(/[+,\s]+/).map(x => x.trim()).filter(Boolean).forEach(id => {
    if (styles[id]) selectedStyles.add(id);
  });

  // Open categories containing preselected styles.
  styleButtons.forEach(btn => {
    if (!selectedStyles.has(btn.dataset.style)) return;
    const content = btn.closest('.content');
    if (!content) return;
    content.classList.add('open');
    const categoryButton = content.previousElementSibling;
    if (categoryButton?.classList.contains('collapsible')) {
      categoryButton.classList.add('active');
      categoryButton.setAttribute('aria-expanded', 'true');
    }
  });
}

initializeFromUrl();
render();
</script>
